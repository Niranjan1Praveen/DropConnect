<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Region Suitability Analyzer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    #map { height: 100vh; }
    
    /* Enhanced Popup Styles */
    .leaflet-popup-content {
      min-width: 280px;
      padding: 12px;
      margin: 0;
    }
    .popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }
    .score-badge {
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 12px 0;
    }
    .metric {
      background: #f8f9fa;
      padding: 6px 8px;
      border-radius: 4px;
    }
    .metric-label {
      font-size: 12px;
      color: #666;
      display: block;
    }
    .metric-value {
      font-weight: bold;
      font-size: 13px;
    }
    .recommendation-box {
      padding: 10px;
      background: #f8fafc;
      margin-top: 12px;
      border-left: 4px solid;
      font-size: 13px;
    }
    .issues {
      font-size: 12px;
      color: #e74c3c;
      margin-top: 6px;
    }
    
    /* Legend & Controls */
    .legend {
      background: white;
      padding: 10px;
      font-size: 12px;
      line-height: 18px;
      color: #555;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    .legend span {
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-right: 6px;
      border-radius: 50%;
    }
    .clear-btn {
      padding: 6px 10px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.3s;
    }
    .clear-btn:hover {
      background: #f5f5f5;
    }
    .clear-btn.cleared {
      background-color: #2ecc71;
      color: white;
      border-color: #27ae60;
    }
    
    /* Spinner */
    .spinner {
      background: rgba(255,255,255,0.8);
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
    }
    .spinner i {
      animation: spin 1s linear infinite;
      margin-right: 5px;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    // Initialize map centered on India
    const map = L.map('map').setView([22.0, 78.0], 5);
    const analyzedLocations = new L.FeatureGroup().addTo(map);

    // Nationwide ML risk zones: one coloured pointer per grid cell across India
    const riskZones = new L.FeatureGroup().addTo(map);
    fetch("zones").then(r => r.json()).then(({ points, season }) => {
      points.forEach(p => {
        const color = RISK_COLORS[p.risk_level];
        L.circleMarker([p.lat, p.lon], {
          radius: 7, color: "#fff", weight: 1, fillColor: color, fillOpacity: 0.85
        }).bindPopup(`
          <div class="popup-header"><h3 style="margin:0;font-size:15px">${p.region} India</h3>
            <div class="score-badge" style="background:${color}">${p.risk_level}</div></div>
          <div style="font-size:12px;color:#666">${season} estimate · ${p.lat}, ${p.lon} · ML confidence ${(p.risk_confidence * 100).toFixed(0)}%</div>
          <div style="margin:8px 0">${probBars(p.risk_probabilities)}</div>
          <button onclick="explainZone(${p.lat}, ${p.lon})" style="width:100%;padding:6px;border:0;border-radius:4px;background:#4f46e5;color:#fff;cursor:pointer">
            Analyse in detail + Gemini explanation</button>`).addTo(riskZones);
      });
      // Little summary of how many zones fall in each class
      const counts = points.reduce((a, p) => (a[p.risk_level] = (a[p.risk_level] || 0) + 1, a), {});
      document.getElementById("zone-counts").innerHTML = Object.keys(RISK_COLORS)
        .map(k => `<span style='background:${RISK_COLORS[k]}'></span> ${k} <b>${counts[k] || 0}</b>`).join("<br>");
    }).catch(err => console.error("Zone layer failed:", err));

    // Run the full analysis (live features + drivers + Gemini) for a zone's point
    window.explainZone = (lat, lon) => {
      map.closePopup();
      map.fire("click", { latlng: L.latLng(lat, lon) });
    };
    let adminLayer;

    // 1. Enhanced Base Maps (3 options now)
    const baseLayers = {
      "Street Map": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map),
      "Satellite": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri'
      }),
      "Terrain": L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
        attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 17
      })
    };

    // Load GeoJSON boundaries
    Promise.all([
      fetch("static/india-composite.geojson").then(r => r.json()),
      fetch("static/india-admin.geojson").then(r => r.json())
    ]).then(([boundary, admin]) => {
      // Add boundary layer
      L.geoJSON(boundary, { 
        style: { color: 'blue', weight: 1, fillOpacity: 0 } 
      }).addTo(map);
      
      // Add admin layer with hover effects
      adminLayer = L.geoJSON(admin, {
        style: { color: '#666', weight: 1, opacity: 0.7, fillOpacity: 0.1 },
        onEachFeature: function(feature, layer) {
          layer.on({
            mouseover: function() {
              this.setStyle({ weight: 2, color: '#222' });
            },
            mouseout: function() {
              this.setStyle({ weight: 1, color: '#666' });
            }
          });
        }
      }).addTo(map);
      
      // Add layer control
      L.control.layers(baseLayers, {
        "State Boundaries": adminLayer,
        "ML Risk Zones": riskZones,
        "Analyzed Locations": analyzedLocations
      }, {collapsed: false}).addTo(map);
    }).catch(err => {
      console.error("Failed to load GeoJSON:", err);
      alert("Map data failed to load. Please refresh the page.");
    });

    // Click handler for location analysis
    map.on('click', function(e) {
      const point = turf.point([e.latlng.lng, e.latlng.lat]);
      
      // Show loading spinner
      const spinner = L.control({position: 'topleft'});
      spinner.onAdd = function() {
        const div = L.DomUtil.create('div', 'spinner');
        div.innerHTML = '<i class="fas fa-spinner"></i> Analyzing...';
        return div;
      };
      spinner.addTo(map);

      // Check if point is in India
      fetch("static/india-composite.geojson")
        .then(r => r.json())
        .then(indiaBoundary => {
          const inside = turf.booleanPointInPolygon(point, indiaBoundary.features[0]);
          if (!inside) {
            alert("Please click inside India's land area.");
            throw new Error("Clicked outside India");
          }
          
          return fetch("analyze", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              latitude: e.latlng.lat,
              longitude: e.latlng.lng
            })
          });
        })
        .then(res => {
          if (!res.ok) throw new Error(`Analysis failed: ${res.status}`);
          return res.json();
        })
        .then(data => {
          if (data.error) throw new Error(data.error);
          
          // Get region name from admin boundaries
          let regionName = "Unknown Region";
          if (adminLayer) {
            adminLayer.eachLayer(function(layer) {
              if (layer.feature && turf.booleanPointInPolygon(point, layer.feature)) {
                const props = layer.feature.properties;
                regionName = props.NAME_1 || props.STATE || props.NAME || "Unknown Region";
              }
            });
          }
          
          // Add analysis result to map
          addAnalysisResult(e.latlng, data, regionName);
        })
        .catch(error => {
          console.error("Error:", error);
          if (!error.message.includes("Clicked outside India")) {
            alert(error.message || "Analysis failed. Please try again.");
          }
        })
        .finally(() => map.removeControl(spinner));
    });

    // Colour per ML risk class (Low -> Severe)
    const RISK_COLORS = { Low: "#2ecc71", Moderate: "#f1c40f", High: "#e67e22", Severe: "#e74c3c" };
    const pretty = (f) => f.replace(/_/g, " ").replace(" mm", "").replace(" percent", " %");

    // Tiny horizontal bar for each class probability
    const probBars = (p) => Object.entries(p).map(([k, v]) => `
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;margin:2px 0">
        <span style="width:62px">${k}</span>
        <div style="flex:1;background:#eee;border-radius:3px;height:8px">
          <div style="width:${(v * 100).toFixed(0)}%;background:${RISK_COLORS[k]};height:8px;border-radius:3px"></div>
        </div>
        <span style="width:34px;text-align:right">${(v * 100).toFixed(0)}%</span>
      </div>`).join("");

    // Top model drivers: red arrow = raised the risk, green = lowered it
    const driverList = (d) => (d || []).map((x) => `
      <li style="font-size:12px">${x.impact > 0 ? "🔺" : "🔻"} ${pretty(x.feature)}${x.value !== null ? ` <b>${x.value}</b>` : ""}</li>`).join("");

    // Ask the server to turn this prediction into a PDF stored in MongoDB
    window.saveReport = async (id, btn) => {
      btn.disabled = true; btn.textContent = "Saving...";
      // Inside the website we go through Next so the PDF is tagged with the logged-in user
      const url = location.pathname.startsWith("/map-app") ? `/api/map/report/${id}` : `report/${id}`;
      const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
      btn.textContent = r.ok ? "Saved to Reports ✓" : "Save failed";
    };

    function addAnalysisResult(latlng, data, regionName) {
      const color = RISK_COLORS[data.risk_level] || "#888";
      const circle = L.circle(latlng, { color, fillColor: color, fillOpacity: 0.3, radius: 10000, weight: 2 });

      const popupContent = `
        <div class="popup-header">
          <h3 style="margin:0;font-size:16px;">${regionName}</h3>
          <div class="score-badge" style="background:${color}">${data.risk_level} risk</div>
        </div>
        <div style="font-size:12px;color:#666">ML confidence ${(data.risk_confidence * 100).toFixed(0)}% · ${data.region || ""} · ${data.season || ""}</div>
        <div style="margin:8px 0">${probBars(data.risk_probabilities)}</div>
        <div class="metrics-grid">
          <div class="metric"><span class="metric-label">Suitability</span><span class="metric-value">${data.score.toFixed(2)}</span></div>
          <div class="metric"><span class="metric-label">Elevation</span><span class="metric-value">${data.elevation}m</span></div>
          <div class="metric"><span class="metric-label">Vegetation</span><span class="metric-value">${data.vegetation_index.toFixed(2)}</span></div>
          <div class="metric"><span class="metric-label">Water</span><span class="metric-value">${data.water_index.toFixed(2)}</span></div>
        </div>
        ${data.drivers && data.drivers.length ? `<b style="font-size:13px">What drove this prediction</b><ul style="margin:4px 0 0 0;padding-left:16px">${driverList(data.drivers)}</ul>` : ""}
        <div class="recommendation-box" style="border-left-color:${color}">
          <b style="font-size:12px">Why? ${data.explanation_source === "gemini" ? "(explained by Gemini)" : ""}</b>
          <p style="margin:4px 0 0 0;">${data.explanation || data.recommendation}</p>
          ${data.issues && data.issues.length ? `<div class="issues"><strong>Local concerns:</strong> ${data.issues.join(", ")}</div>` : ""}
        </div>
        ${data.result_id ? `<button onclick="saveReport('${data.result_id}', this)" style="margin-top:8px;width:100%;padding:6px;border:0;border-radius:4px;background:#4f46e5;color:#fff;cursor:pointer">Save as PDF report</button>` : ""}
      `;

      circle.bindPopup(popupContent, { maxWidth: 340 }).openPopup();
      analyzedLocations.addLayer(circle);
    }

    // Add legend
    const legend = L.control({ position: "bottomright" });
    legend.onAdd = function() {
      const div = L.DomUtil.create("div", "legend");
      div.innerHTML = `
        <b>ML Risk Zones</b><br><div id='zone-counts'>
        <span style='background:#2ecc71'></span> Low<br>
        <span style='background:#f1c40f'></span> Moderate<br>
        <span style='background:#e67e22'></span> High<br>
        <span style='background:#e74c3c'></span> Severe</div><small>Click a dot for details</small>
      `;
      return div;
    };
    legend.addTo(map);

    // 2. Enhanced Clear Results Button
    L.control({
      position: 'topright'
    }).onAdd = function() {
      const container = L.DomUtil.create('div', 'clear-container');
      const btn = L.DomUtil.create('button', 'clear-btn');
      btn.innerHTML = '<i class="fas fa-trash"></i> Clear Results';
      btn.onclick = () => {
        analyzedLocations.clearLayers();
        btn.innerHTML = '<i class="fas fa-check"></i> Cleared!';
        L.DomUtil.addClass(btn, 'cleared');
        setTimeout(() => {
          btn.innerHTML = '<i class="fas fa-trash"></i> Clear Results';
          L.DomUtil.removeClass(btn, 'cleared');
        }, 1500);
      };
      container.appendChild(btn);
      return container;
    }.addTo(map);
  </script>
</body>
</html>
